name: 'automerge'
on:
  pull_request: {}
  status:       {}
  check_suite:  {types: ['completed']}

jobs:
  automerge:
    runs-on: 'ubuntu-latest'
    permissions:
      contents:      'write'
      pull-requests: 'write'
    steps:
      - uses: 'pascalgn/automerge-action@v0.16.4'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
